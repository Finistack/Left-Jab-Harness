# Renovate for the Left Jab harness repo.
#
# The harness image's build-time toolchain (dotnet SDK base, Node major, Claude Code CLI)
# is pinned in src/build/pr-bot/Dockerfile. This workflow keeps those pins current, since
# the monorepo's self-hosted Renovate only manages the *image tag* it consumes, not the
# dependencies baked into the image built here.
#
# Runs with the workflow's automatic GITHUB_TOKEN (contents + pull-requests write); no
# repository secret is required for this public repo. A GitHub App or PAT (RENOVATE_TOKEN)
# is only needed later if Renovate must trigger further workflows on its own PRs.
name: Renovate

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.6
        with:
          configurationFile: renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: info
